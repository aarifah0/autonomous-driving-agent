# Configuration file for highway-env RL agent using Stable-Baselines3

env:
  id: "highway-v0"
  config:
    lanes_count: 4
    vehicles_count: 50
    duration: 40
    observation:
      type: "Kinematics"
      vehicles_count: 5
      features:
        - "presence"
        - "x"
        - "y"
        - "vx"
        - "vy"
        - "heading"
      absolute: False
      normalize: True
      order: "sorted"
    action:
      type: "DiscreteMetaAction"
    simulation_frequency: 15
    policy_frequency: 5

wrapper:
  weight_speed: 1.5
  weight_collision: 20.0
  weight_lane: 0.8
  v_min: 0.0
  v_max: 30.0

agent:
  policy: "MlpPolicy"
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 64
  n_epochs: 10
  gamma: 0.95
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  verbose: 1
  policy_kwargs:
    net_arch:
      pi: [256, 256]
      vf: [256, 256]

training:
  total_timesteps: 500000
  checkpoint_freq: 50000
  eval_freq: 10000
  eval_episodes: 2
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
